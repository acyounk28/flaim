[project]
name = "flaim-nfl-metrics"
version = "0.1.0"
description = "FastMCP server exposing nflverse/nflfastR efficiency + usage metrics and an autonomous-GM tool suite (injury leverage, waivers/FAAB, trades, game environments, MILP lineups) with local parquet caching for Raspberry Pi deployments."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "mcp>=1.10,<2",
  "nflreadpy>=0.1.5,<0.2",
  "polars>=1.20",
  "httpx>=0.27",
  "uvicorn>=0.30",
  "starlette>=0.40",
  "scipy>=1.11",
  "numpy>=1.26",
  "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nfl-metrics-mcp = "nfl_metrics.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nfl_metrics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
